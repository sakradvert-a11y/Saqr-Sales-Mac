<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>صقر للمبيعات والمخازن</title><style>
:root{--w:#541238;--p:#b32670;--bg:#f7f3f7;--l:#e5dce4}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Tahoma,Arial;background:var(--bg);color:#625963}.side{position:fixed;right:0;top:0;bottom:0;width:280px;background:var(--w);color:#fff;padding:22px}.logo{background:#fff;border-radius:22px;text-align:center;padding:15px}.logo img{max-width:100%;height:105px;object-fit:contain}.co{text-align:center;font-size:20px;font-weight:bold;padding:18px 0}.nav button{width:100%;border:0;background:none;color:#fff;text-align:right;padding:13px;border-radius:9px;font-size:16px}.nav button.active,.nav button:hover{background:#ffffff1c}.main{margin-right:280px;padding:25px}.title{color:var(--w);font-size:30px;border-bottom:1px solid var(--l);padding-bottom:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#fff;border:1px solid var(--l);border-radius:18px;padding:19px;margin-top:15px;box-shadow:0 6px 20px #5412380b}.v{font-size:29px;font-weight:bold;color:var(--p);margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px}.btn{background:var(--w);color:#fff;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}.btn.alt{background:#eee7ec;color:var(--w)}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.prod{border:1px solid var(--l);border-radius:14px;overflow:hidden;background:#fff}.prod img{width:100%;height:145px;object-fit:cover}.prod div{padding:10px}.item{display:grid;grid-template-columns:2fr .7fr 1fr 1fr 35px;gap:6px;margin:7px 0}.item>*{padding:8px;border:1px solid var(--l);border-radius:7px}.hidden{display:none}.total{font-size:21px;font-weight:bold;color:var(--w);margin:12px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--l);text-align:right}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr 1fr}}
</style></head><body>
<aside class="side"><div class="logo"><img src="saqr-logo.png"></div><div class="co">صقر للدعاية والإعلان والتوريدات</div><div class="nav">
<button class="active" onclick="go('dashboard',this)">لوحة التحكم</button><button onclick="go('products',this)">المنتجات والمخزن</button><button onclick="go('services',this)">الخدمات</button><button onclick="go('sales',this)">البيع والفواتير</button><button onclick="go('purchases',this)">المشتريات</button><button onclick="go('backup',this)">النسخ الاحتياطي</button></div></aside>
<main class="main"><div class="title" id="title">لوحة التحكم</div>
<section id="dashboard"><div class="cards"><div class="card">إجمالي المبيعات<div class="v" id="a">0.00</div></div><div class="card">إجمالي المشتريات<div class="v" id="b">0.00</div></div><div class="card">صافي الربح<div class="v" id="c">0.00</div></div><div class="card">قيمة المخزون<div class="v" id="d">0.00</div></div><div class="card">عدد المنتجات<div class="v" id="e">0</div></div><div class="card">عدد الفواتير<div class="v" id="f">0</div></div></div></section>
<section id="products" class="hidden"><div class="panel"><h2>إضافة منتج</h2><div class="grid"><div class="field"><label>اسم المنتج</label><input id="pn"></div><div class="field"><label>الكود</label><input id="pk"></div><div class="field"><label>سعر الشراء</label><input id="pb" type="number"></div><div class="field"><label>سعر البيع</label><input id="ps" type="number"></div><div class="field"><label>الكمية</label><input id="pq" type="number" value="0"></div><div class="field"><label>حد التنبيه</label><input id="pm" type="number" value="0"></div></div><br><button class="btn" onclick="addProduct()">إضافة المنتج</button></div><div class="panel"><h2>المنتجات وصورها</h2><div class="products" id="pg"></div></div></section>
<section id="services" class="hidden"><div class="panel"><h2>الخدمات</h2><div class="grid"><input id="sn" placeholder="اسم الخدمة"><input id="sp" type="number" placeholder="السعر"></div><br><button class="btn" onclick="addService()">إضافة الخدمة</button></div><div class="panel"><table id="st"></table></div></section>
<section id="sales" class="hidden"><div class="panel"><h2>فاتورة بيع A5</h2><div class="grid"><input id="sno" readonly><input id="cust" placeholder="العميل"></div><hr><div id="si"></div><button class="btn alt" onclick="addItem('sale')">+ إضافة بند</button><div class="total">الإجمالي: <span id="stotal">0.00</span> جنيه</div><button class="btn" onclick="invoice('sale')">حفظ الفاتورة</button> <button class="btn alt" onclick="print()">طباعة A5</button></div><div class="panel"><table id="salesT"></table></div></section>
<section id="purchases" class="hidden"><div class="panel"><h2>فاتورة شراء</h2><div class="grid"><input id="pno" readonly><input id="sup" placeholder="المورد"></div><hr><div id="pi"></div><button class="btn alt" onclick="addItem('purchase')">+ إضافة بند</button><div class="total">الإجمالي: <span id="ptotal">0.00</span> جنيه</div><button class="btn" onclick="invoice('purchase')">حفظ الفاتورة</button></div></section>
<section id="backup" class="hidden"><div class="panel"><h2>النسخ الاحتياطي</h2><button class="btn" onclick="exportDB()">تصدير البيانات</button> <label class="btn alt">استيراد البيانات<input hidden type="file" accept=".json" onchange="importDB(event)"></label><hr><div id="audit"></div></div></section>
</main><script>
let db=JSON.parse(localStorage.getItem('saqr_v2')||'null')||{products:[],services:[],sales:[],purchases:[],audit:[],seq:1000};const $=x=>document.getElementById(x);
function save(){localStorage.setItem('saqr_v2',JSON.stringify(db));refresh()}function go(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('title').textContent=b.textContent}
function audit(a,r){db.audit.unshift({date:new Date().toLocaleString('ar-EG'),action:a,ref:r})}
function addProduct(){let p={name:$('pn').value,code:$('pk').value,buy:+$('pb').value||0,sell:+$('ps').value||0,qty:+$('pq').value||0,min:+$('pm').value||0,image:'product-sample.jpg'};if(!p.name)return;db.products.push(p);audit('إضافة منتج',p.name);save()}
function addService(){if(!$('sn').value)return;db.services.push({name:$('sn').value,price:+$('sp').value||0});audit('إضافة خدمة',$('sn').value);save()}
function opts(){return '<option value="">اختر</option>'+db.products.map((p,i)=>`<option value="p:${i}">📦 ${p.name}</option>`).join('')+db.services.map((s,i)=>`<option value="s:${i}">🛠️ ${s.name}</option>`).join('')}
function addItem(t){let box=$(t==='sale'?'si':'pi'),r=document.createElement('div');r.className='item';r.innerHTML=`<select onchange="chg(this,'${t}')">${opts()}</select><input class=q type=number value=1 min=0 oninput="calc('${t}')"><input class=p type=number value=0 min=0 oninput="calc('${t}')"><input class=l readonly value=0><button class=btn onclick="this.parentElement.remove();calc('${t}')">×</button>`;box.appendChild(r)}
function chg(s,t){let r=s.parentElement,v=s.value;if(v){let[k,i]=v.split(':');r.querySelector('.p').value=k==='p'?(t==='purchase'?db.products[i].buy:db.products[i].sell):db.services[i].price}calc(t)}
function calc(t){let total=0;$(t==='sale'?'si':'pi').querySelectorAll('.item').forEach(r=>{let x=(+r.querySelector('.q').value||0)*(+r.querySelector('.p').value||0);r.querySelector('.l').value=x.toFixed(2);total+=x});$(t==='sale'?'stotal':'ptotal').textContent=total.toFixed(2);return total}
function collect(t){let a=[];$(t==='sale'?'si':'pi').querySelectorAll('.item').forEach(r=>{if(!r.querySelector('select').value)return;let[k,i]=r.querySelector('select').value.split(':');a.push({k,i:+i,q:+r.querySelector('.q').value||0,p:+r.querySelector('.p').value||0})});return a}
function invoice(t){let items=collect(t);if(!items.length)return;let total=calc(t),no=++db.seq;items.forEach(x=>{if(x.k==='p')db.products[x.i].qty+=t==='purchase'?x.q:-x.q});let obj={no,total,items,name:t==='sale'?$('cust').value:$('sup').value,date:new Date().toISOString()};(t==='sale'?db.sales:db.purchases).push(obj);audit(t==='sale'?'حفظ فاتورة بيع':'حفظ فاتورة شراء','رقم '+no);save();$(t==='sale'?'sno':'pno').value=db.seq+1}
function refresh(){$('a').textContent=db.sales.reduce((x,y)=>x+y.total,0).toFixed(2);$('b').textContent=db.purchases.reduce((x,y)=>x+y.total,0).toFixed(2);$('c').textContent=$('a').textContent;$('d').textContent=db.products.reduce((x,y)=>x+y.qty*y.buy,0).toFixed(2);$('e').textContent=db.products.length;$('f').textContent=db.sales.length;
$('pg').innerHTML=db.products.map(p=>`<div class=prod><img src="${p.image||'product-sample.jpg'}"><div><b>${p.name}</b><br>كود: ${p.code||'-'}<br>السعر: ${p.sell.toFixed(2)} ج<br>الرصيد: ${p.qty}</div></div>`).join('');
$('st').innerHTML=db.services.map(s=>`<tr><td>${s.name}</td><td>${s.price.toFixed(2)} جنيه</td></tr>`).join('');$('salesT').innerHTML=db.sales.map(s=>`<tr><td>${s.no}</td><td>${s.name||'-'}</td><td>${s.total.toFixed(2)}</td></tr>`).join('');$('audit').innerHTML=db.audit.map(x=>`<div>${x.date} — ${x.action} — ${x.ref}</div>`).join('')}
function exportDB(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='saqr-backup.json';a.click()}function importDB(e){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save()}catch{alert('ملف غير صالح')}};r.readAsText(e.target.files[0])}
refresh();$('sno').value=db.seq+1;$('pno').value=db.seq+1;addItem('sale');addItem('purchase');
</script></body></html>
